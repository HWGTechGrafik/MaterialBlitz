<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- Dieselben Angaben wie die App, sonst misst die Seite etwas anderes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Masse</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      @supports (height: 100dvh) { html, body { height: 100dvh; } }
      body {
        background: #14202e; color: #e6edf5;
        font: 15px/1.5 'Segoe UI', system-ui, sans-serif;
        display: flex; flex-direction: column;
      }
      .kopf { flex: none; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: #1c4f8a; }
      .rumpf { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; }
      .fuss { flex: none; background: #b4560e; padding: 14px 16px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; font-weight: 700; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      td { padding: 3px 0; border-bottom: 1px solid #2a3949; }
      td:last-child { text-align: right; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="kopf">Kopf — oben buendig?</div>
    <div class="rumpf"><table id="t"></table></div>
    <div class="fuss">Fuss — klebt das hier an der Unterkante?</div>
    <script>
      const zeilen = [
        ['screen.height', screen.height],
        ['innerHeight', innerHeight],
        ['visualViewport', Math.round(visualViewport.height)],
        ['documentElement.clientHeight', document.documentElement.clientHeight],
        ['100dvh', mess('100dvh')],
        ['100svh', mess('100svh')],
        ['100lvh', mess('100lvh')],
        ['inset-top', mess('env(safe-area-inset-top, 0px)')],
        ['inset-bottom', mess('env(safe-area-inset-bottom, 0px)')],
        ['devicePixelRatio', devicePixelRatio],
        ['standalone', navigator.standalone === true ? 'ja' : 'nein (Browser!)'],
      ];
      function mess(wert) {
        const p = document.createElement('div');
        p.style.cssText = 'position:absolute;visibility:hidden;height:' + wert;
        document.body.append(p);
        const h = Math.round(p.getBoundingClientRect().height);
        p.remove();
        return h;
      }
      document.getElementById('t').innerHTML = zeilen
        .map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>')
        .join('');
    </script>
  </body>
</html>
